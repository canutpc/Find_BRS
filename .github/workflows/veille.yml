name: Veille Immobiliere Croix-Rousse

on:
  schedule:
    - cron: '0 7 * * *'   # Tous les jours à 07:00 UTC
  workflow_dispatch:       # Permet aussi de lancer un test manuel en 1 clic

permissions:
  contents: write

jobs:
  update-veille:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Lancer la veille et filtrer
        run: python scraper.py

      - name: Sauvegarder les nouveaux résultats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Mise à jour veille immobilière" && git push)
