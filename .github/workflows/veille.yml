name: Veille Immobiliere Croix-Rousse

on:
  schedule:
    - cron: '30 6 * * *'  # Tous les jours à 06:30 UTC (~07h30 hiver / 08h30 été à Lyon)
  workflow_dispatch:       # Permet de tester l'envoi d'e-mail en 1 clic

permissions:
  contents: write

jobs:
  update-veille:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Lancer la veille et envoyer l'e-mail
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
        run: python scraper.py

      - name: Sauvegarder les résultats sur GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Mise à jour veille immobilière" && git push)
